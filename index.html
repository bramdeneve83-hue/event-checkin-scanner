
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Event Check-in Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f7;
      padding: 20px;
      text-align: center;
      color: #172b3a;
    }

    .kaart {
      max-width: 430px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #172b3a;
      color: white;
      border: none;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #resultaat {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="kaart">
    <h2>EVENT CHECK-IN</h2>

    <div id="aanmelden">
      <p>Voer je persoonlijke medewerkerscode in.</p>

      <input
        id="medewerkerCode"
        type="password"
        placeholder="Medewerkerscode"
        autocomplete="off"
      >

      <button onclick="aanmelden()">
        Aanmelden
      </button>
    </div>

    <div id="scannerScherm" hidden>
      <p>Richt je camera op een QR-code.</p>

      <div id="reader"></div>

      <button id="startKnop" onclick="startScanner()">
        Scanner starten
      </button>

      <button onclick="afmelden()">
        Afmelden
      </button>
    </div>

    <div id="resultaat" role="status"></div>
  </div>

  <script>
    const API =
      "https://event-checkin-api.bram-deneve83.workers.dev";

    let toegangscode = "";
    let scanner = null;
    let bezig = false;

    function toonResultaat(bericht, kleur) {
      const vak = document.getElementById("resultaat");
      vak.textContent = bericht;
      vak.style.background = kleur;
      vak.style.display = "block";
    }

    async function aanmelden() {
      const invoer =
        document.getElementById("medewerkerCode");

      const code = invoer.value.trim();

      if (!code) {
        toonResultaat(
          "Vul eerst je medewerkerscode in.",
          "#ffe6c7"
        );
        return;
      }

      // De code wordt bij iedere ticketcontrole
      // opnieuw door Google Apps Script gecontroleerd.
      toegangscode = code;
      invoer.value = "";

      document.getElementById("aanmelden").hidden = true;
      document.getElementById("scannerScherm").hidden = false;

      toonResultaat(
        "Code ingevoerd. Start de scanner.",
        "#e7eef7"
      );
    }

    async function startScanner() {
      if (scanner || bezig || !toegangscode) return;

      document.getElementById("startKnop").disabled = true;

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 220, height: 220 }
          },
          async (tekst) => {
            if (bezig) return;
            bezig = true;

            toonResultaat(
              "Ticket controleren...",
              "#e7eef7"
            );

            try {
              await scanner.stop();
              scanner.clear();
            } catch (e) {}

            scanner = null;

            try {
              const antwoord = await fetch(API, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  medewerkerCode: toegangscode,
                  ticketCode: tekst
                })
              });

              const resultaat = await antwoord.json();

              if (antwoord.status === 429) {
                toonResultaat(
                  "Te veel pogingen. Probeer later opnieuw.",
                  "#ffe6c7"
                );
              } else if (resultaat.status === "geldig") {
                toonResultaat(
                  "TOEGANG TOEGESTAAN\n" +
                  (resultaat.naam || "") + "\n" +
                  (resultaat.bericht || ""),
                  "#d9f5e3"
                );
              } else if (resultaat.status === "gebruikt") {
                toonResultaat(
                  "AL GEBRUIKT\n" +
                  (resultaat.naam || ""),
                  "#ffe6c7"
                );
              } else {
                toonResultaat(
                  resultaat.bericht || "Ticket geweigerd.",
                  "#ffdada"
                );
              }

            } catch (fout) {
              toonResultaat(
                "Verbinding mislukt. Controleer het ticket opnieuw.",
                "#ffdada"
              );
            } finally {
              bezig = false;
              document.getElementById("startKnop").disabled =
                false;
            }
          },
          () => {}
        );

      } catch (fout) {
        scanner = null;
        bezig = false;
        document.getElementById("startKnop").disabled = false;

        toonResultaat(
          "Camera kon niet starten: " + fout.message,
          "#ffdada"
        );
      }
    }

    async function afmelden() {
      if (bezig) return;

      if (scanner) {
        try {
          await scanner.stop();
          scanner.clear();
        } catch (e) {}
        scanner = null;
      }

      toegangscode = "";
      document.getElementById("scannerScherm").hidden = true;
      document.getElementById("aanmelden").hidden = false;
      document.getElementById("resultaat").style.display =
        "none";
    }
  </script>
</body>
</html>
